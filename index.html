<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIUI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <h1>DIUI Assistant</h1>
    <p>Asistente de conversación para resolver dudas prácticas. En este chat te puede ayudar incluso a reparar tu bicicleta.</p>
    <p id="contador">Mensajes: 0</p>
</header>

<main>

    <nav class="sidebar">
        <h2>Conversaciones</h2>
        <ul>
            <li>Reparar bici</li>
            <li>Configuración app</li>
            <li>Ideas de diseño</li>
            <li>Dudas UI</li>
        </ul>
        <button id="limpiar">Limpiar chat</button>
    </nav>

    <section class="chat" id="chat">
        <!-- ya no tengo que poner los mensajes porque ya se renderizan con el script-->
    </section>

</main>

<footer>

<form id="formulario">
    <label for="mensaje">Mensaje:</label>
    <input type="text" id="mensaje" required>

    <button type="submit" aria-label="Enviar mensaje">
        Enviar
    </button>
</form>

</footer>
<script src="script.js"></script>
</body>
</html>
