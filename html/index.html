<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIUI Assistant</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Old+Mincho:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>
            DIUI Assistant
        </h1>
        <p>Un asistente que te apoya en cualquier pregunta que se te ocurra mientras cursas Diseño de Interfaces.
            Utiliza distintos tonos de verde.</p>
    </header>

    <main>

        <nav>
            <button class="btn">Nuevo chat</button>
            <ul>
                <li>
                    <> Chat 1
                </li>
                <li>
                    <> Chat 2
                </li>
                <li>
                    <> Chat 3
                </li>
                <li>
                    <> Chat 4
                </li>
            </ul>
        </nav>

        <div class="chat-container">
            <section>
            </section>

            <footer>
                <p id="msg-count">Mensajes: 0</p>
                <form action="" method="post">
                    <label for="msg">::</label>
                    <input type="text" id="msg" name="msg" placeholder="¿Qué deseas conocer?" required
                        aria-required="true">
                    <button type="submit" aria-label="Enviar mensaje">Enviar</button>
                </form>

            </footer>
        </div>
    </main>
    <script src="../JS/script.js"></script>
</body>



</html>
