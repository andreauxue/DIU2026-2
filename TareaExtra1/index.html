<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Zen+Old+Mincho:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Lista de Orders</h1>
    </header>

    <main>
        <div class="stats">
            <span id="pending-count">Orders Pendientes: 0</span>
            <span id="completed-count">Orders Completadas: 0</span>
        </div>


        <div class="container">
            <input type="text" id="input" placeholder="Nueva order" />
            <button class="addButton" onclick="addOrder()">Agregar</button>
        </div>

        <ul id="list" class="list">

        </ul>
    </main>
    <!-- Se agregó aqui siguiendo "Placing scripts at the bottom of the <body> element improves the display speed, because script interpretation slows down the display." de https://www.w3schools.com/js/js_whereto.asp -->
    <script src="script.js"></script>
</body>



</html>
