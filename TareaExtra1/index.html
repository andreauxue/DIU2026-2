<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Lista de Tareas</h1>
        
        <div class="input-container">
            <input type="text" id="taskInput" placeholder="Escribe una tarea...">
            <button id="addTaskBtn">Agregar</button>
        </div>

        <div class="counter">
            <p>Total: <span id="totalCount">0</span></p>
            <p>Completadas: <span id="completedCount">0</span></p>
            <p>Pendientes: <span id="pendingCount">0</span></p>
        </div>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
