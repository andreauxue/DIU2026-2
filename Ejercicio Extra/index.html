<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de tareas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="contenedor">
    <h1>Lista de tareas</h1>

    <section class="formulario">
      <input
        type="text"
        id="inputTarea"
        placeholder="Escribe una tarea"
        aria-label="Escribe una tarea"
      />
      <button id="btnAgregar">Agregar</button>
    </section>

    <p id="mensajeError" class="mensaje-error"></p>

    <section class="contadores">
      <p>Tareas totales: <span id="totalTareas">0</span></p>
      <p>Tareas completadas: <span id="tareasCompletadas">0</span></p>
      <p>Tareas pendientes: <span id="tareasPendientes">0</span></p>
    </section>

    <ul id="listaTareas" class="lista-tareas"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
