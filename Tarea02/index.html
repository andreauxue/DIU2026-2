<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat POO - Estado y Render</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="chat-app">
        <header class="chat-header">
            <h2>Asistente Virtual</h2>
            <div class="controles">
                <span id="contador-ui">Mensajes: 0</span>
                <button id="btn-limpiar">Limpiar Chat</button>
            </div>
        </header>
        
        <section id="area-mensajes" class="area-mensajes">
            </section>

        <footer class="chat-input-area">
            <input type="text" id="input-mensaje" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
            <button id="btn-enviar">Enviar</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
